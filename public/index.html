<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Athena Agents</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/vendor/xterm.css" />
    <link rel="stylesheet" href="/dist/app.css" />
  </head>
  <body>
    <div id="app" class="grid min-h-screen grid-cols-[var(--spacing-nav)_1fr] max-md:grid-cols-[1fr] md:in-[.station-mode]:grid-cols-[58px_1fr]">
      <aside id="nav" class="sticky top-0 flex h-screen flex-col border-r border-line bg-side pt-5 pb-4 max-md:fixed max-md:left-0 max-md:z-40 max-md:w-nav max-md:[transform:translateX(-100%)] max-md:[transition:transform_0.2s] max-md:in-[.nav-open]:transform-none max-md:in-[.nav-open]:shadow-pop max-md:in-[.station-mode.nav-wide]:bottom-0 max-md:in-[.station-mode.nav-wide]:z-80 max-md:in-[.station-mode.nav-wide]:transform-none max-md:in-[.station-mode.nav-wide]:shadow-pop max-md:in-[.station-mode.nav-wide]:animate-[nav-wide-in_0.24s_cubic-bezier(.2,.8,.2,1)] md:in-[.station-mode]:fixed md:in-[.station-mode]:top-0 md:in-[.station-mode]:bottom-0 md:in-[.station-mode]:left-0 md:in-[.station-mode]:z-80 md:in-[.station-mode]:w-nav md:in-[.station-mode]:overflow-hidden md:in-[.station-mode]:animate-none md:in-[.station-mode]:border-r-transparent md:in-[.station-mode]:[clip-path:inset(0_calc(100%-58px)_0_0)] md:in-[.station-mode]:[transition:clip-path_0.45s_cubic-bezier(.22,.9,.25,1),box-shadow_0.45s_ease] md:in-[.station-mode]:after:pointer-events-none md:in-[.station-mode]:after:absolute md:in-[.station-mode]:after:top-0 md:in-[.station-mode]:after:bottom-0 md:in-[.station-mode]:after:left-[57px] md:in-[.station-mode]:after:w-px md:in-[.station-mode]:after:bg-line md:in-[.station-mode]:after:[transition:opacity_0.3s_ease] md:in-[.station-mode.nav-wide]:border-r-line md:in-[.station-mode.nav-wide]:shadow-pop md:in-[.station-mode.nav-wide]:[clip-path:inset(0_-120px_0_0)] md:in-[.station-mode.nav-wide]:after:opacity-0">
        <a class="flex items-center gap-3 px-6 pb-6 text-ink max-md:in-[.station-mode]:justify-center max-md:in-[.station-mode]:px-0 max-md:in-[.station-mode.nav-wide]:justify-start max-md:in-[.station-mode.nav-wide]:px-6 md:in-[.station-mode]:justify-start md:in-[.station-mode]:pr-0 md:in-[.station-mode]:pl-[17px]" href="#/station" aria-label="Athena Agents">
          <svg class="brand-mark size-6 flex-none" viewBox="0 0 64 64" aria-hidden="true">
            <rect width="64" height="64" rx="15" style="fill: var(--color-accent)"/>
            <path d="M10.5 19 22 23.5Q32 20.5 42 23.5L53.5 19Q55 28 54 36Q52 52 32 52 12 52 10 36 9 28 10.5 19Z" style="fill: var(--color-on-accent)"/>
            <circle cx="22.5" cy="36" r="8.4" style="fill: var(--color-accent)"/>
            <circle cx="41.5" cy="36" r="8.4" style="fill: var(--color-accent)"/>
            <circle cx="22.5" cy="36" r="5.4" style="fill: var(--color-on-accent)"/>
            <circle cx="41.5" cy="36" r="5.4" style="fill: var(--color-on-accent)"/>
            <circle cx="23.2" cy="36.4" r="2.5" style="fill: var(--color-accent)"/>
            <circle cx="40.8" cy="36.4" r="2.5" style="fill: var(--color-accent)"/>
            <path d="M32 41 29.4 46.6 32 48.4 34.6 46.6Z" style="fill: var(--color-accent)"/>
          </svg>
          <span class="uppercase font-sans text-[15px] leading-none font-[700] tracking-[-0.015em] max-md:in-[.station-mode]:[display:none] max-md:in-[.station-mode.nav-wide]:inline md:in-[.station-mode]:block md:in-[.station-mode]:whitespace-nowrap md:in-[.station-mode]:opacity-0 md:in-[.station-mode]:[transition:opacity_0.2s_ease] md:in-[.station-mode.nav-wide]:opacity-100 md:in-[.station-mode.nav-wide]:[transition:opacity_0.3s_ease_0.15s]">Athena <span class="font-semibold text-faint">Agents</span></span>
        </a>
        <nav id="nav-links" class="flex flex-col gap-0.5 px-3"></nav>
        <div class="mt-auto border-t border-line px-6 pt-4 text-[12px] leading-[1.7] in-[.station-mode]:[display:none] in-[.station-mode.nav-wide]:block md:in-[.station-mode]:pointer-events-none md:in-[.station-mode]:block md:in-[.station-mode]:w-nav md:in-[.station-mode]:whitespace-nowrap md:in-[.station-mode]:opacity-0 md:in-[.station-mode]:[transition:opacity_0.2s_ease] md:in-[.station-mode.nav-wide]:pointer-events-auto md:in-[.station-mode.nav-wide]:opacity-100 md:in-[.station-mode.nav-wide]:[transition:opacity_0.3s_ease_0.15s]">
          <div id="nav-status" class="flex max-h-[max(8rem,calc(100dvh-30rem))] min-h-0 min-w-0 flex-col gap-px overflow-x-hidden overflow-y-auto text-dim"></div>
          <div id="nav-about" class="mt-3 -mx-2 flex items-center justify-between gap-2 border-t border-line px-2 pt-3 pb-0.5 empty:hidden"></div>
        </div>
      </aside>
      <main id="main" class="flex min-w-0 flex-col md:in-[.station-mode]:col-2">
        <header id="topbar" class="sticky top-0 z-20 flex h-14 items-center gap-4 border-b border-line bg-bg px-10 max-md:px-4 in-[.station-mode]:[display:none]">
          <button id="nav-toggle" class="icon-btn md:hidden" aria-label="Menu">☰</button>
          <h1 id="page-title" class="m-0 font-sans text-[15px] leading-[1.2] font-semibold tracking-[-0.01em]"></h1>
          <div class="top-actions ml-auto flex items-center gap-3">
            <span id="running-pill" class="pill hidden"></span>
            <button id="needs-btn" class="btn ghost small">Needs you <span id="needs-count" class="badge">0</span></button>
          </div>
        </header>
        <section id="view" class="mx-auto w-full max-w-[1400px] min-w-0 px-10 pt-9 pb-20 *:animate-rise-in max-md:px-4 max-md:pt-5 max-md:pb-14"></section>
      </main>
    </div>
    <aside id="drawer" class="glass hidden fixed top-0 right-0 bottom-0 z-50 flex w-[min(540px,100vw)] flex-col not-[.hidden]:animate-in-right" aria-label="Needs you">
      <div class="flex items-center border-b border-line px-6 py-5">
        <h2 class="m-0 flex-1 text-[15px]">Needs you</h2>
        <button class="icon-btn" id="drawer-close" aria-label="Close">✕</button>
      </div>
      <div id="drawer-body" class="flex flex-col gap-4 overflow-y-auto px-6 py-5"></div>
    </aside>
    <div id="modal-root"></div>
    <div id="toasts" class="fixed right-6 bottom-6 z-70 max-w-[min(420px,calc(100vw-48px))]"></div>
    <script type="module" src="/dist/app.js"></script>
  </body>
</html>
