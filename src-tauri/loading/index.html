<!doctype html>
<!-- Shown by the desktop app while the dashboard's server starts, and when it can't.
     The app puts {"title", "error", "log"} as JSON in the #hash (src-tauri/src/main.rs, show_error),
     or {"title", "text"} for a message while it works (installing an update: show_message). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Athena Agents</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --ink: #1a1a1f;
        --dim: #5b5b66;
        --line: #ebebef;
        --panel: #f3f3f6;
        --accent: #18688e;
        --on-accent: #ffffff;
        --red: #d3303f;
        --sans: 'Geist', 'Segoe UI', system-ui, sans-serif;
        --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e0f11;
          --ink: #eceef1;
          --dim: #a3a5b0;
          --line: #212227;
          --panel: #1a1b20;
          --accent: #7cbad5;
          --on-accent: #061923;
          --red: #ff7b7b;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.6 var(--sans);
        -webkit-font-smoothing: antialiased;
        display: grid;
        place-items: center;
        padding: 24px;
        user-select: none;
        -webkit-user-select: none;
      }
      main {
        width: min(520px, 100%);
        padding: 28px;
        text-align: center;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
      }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 24px;
        display: block;
      }
      h1 {
        font-size: 18px;
        font-weight: 600;
        margin: 0 0 8px;
      }
      p {
        margin: 0;
        color: var(--dim);
      }
      .bar {
        width: 160px;
        height: 3px;
        margin: 28px auto 0;
        background: var(--line);
        border-radius: 3px;
        overflow: hidden;
      }
      .bar i {
        display: block;
        width: 40%;
        height: 100%;
        background: var(--accent);
        border-radius: 3px;
        animation: slide 1.1s ease-in-out infinite alternate;
      }
      @keyframes slide {
        from {
          transform: translateX(-10%);
        }
        to {
          transform: translateX(160%);
        }
      }
      .error h1 {
        color: var(--red);
      }
      .error .bar {
        display: none;
      }
      #details {
        display: none;
        margin-top: 24px;
        text-align: left;
      }
      .error #details {
        display: block;
      }
      code {
        display: block;
        padding: 12px 14px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        font: 12.5px/1.5 var(--mono);
        color: var(--ink);
        word-break: break-all;
        user-select: text;
        -webkit-user-select: text;
      }
      a.btn {
        display: inline-block;
        margin-top: 20px;
        padding: 9px 18px;
        border-radius: 7px;
        background: var(--accent);
        color: var(--on-accent);
        font-weight: 500;
        text-decoration: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .bar i {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main id="main">
      <img class="mark" src="icon.png" width="56" height="56" alt="" aria-hidden="true" />
      <h1 id="title">Starting Athena Agents…</h1>
      <p id="text">This takes a few seconds.</p>
      <div class="bar"><i></i></div>
      <div id="details">
        <p>The server's log is here:</p>
        <code id="log"></code>
        <div style="text-align: center"><a class="btn" href="index.html?restart">Try again</a></div>
      </div>
    </main>
    <script>
      function show() {
        let info = null;
        try {
          info = location.hash.length > 1 ? JSON.parse(decodeURIComponent(location.hash.slice(1))) : null;
        } catch {
          info = null;
        }
        if (info && !info.error && info.title) {
          document.getElementById('main').className = '';
          document.getElementById('title').textContent = info.title;
          document.getElementById('text').textContent = info.text || '';
          return;
        }
        if (!info || !info.error) return;
        document.getElementById('main').className = 'error';
        document.getElementById('title').textContent = info.title || 'Athena Agents could not start';
        document.getElementById('text').textContent = info.error;
        document.getElementById('log').textContent = info.log || '(unknown)';
      }
      show();
      addEventListener('hashchange', show);
    </script>
  </body>
</html>
