[package]
name = "athena-agents"
# The app's version comes from package.json (see "version" in tauri.conf.json).
version = "1.0.0"
description = "Athena Agents desktop app: runs the dashboard's server and shows it in its own window"
edition = "2021"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
tauri = { version = "2.12.6", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.3"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-updater = "2.14.0"
tauri-plugin-window-state = "2.5.0"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
