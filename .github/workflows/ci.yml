name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The app is mainly used on Windows; Linux is the quick sanity check.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        id: bun
        with:
          bun-version: 1.4.4

      # Vitest runs on Node, even when started through `bun run`.
      - uses: actions/setup-node@v7
        with:
          node-version: 26

      # Without it every run unpacks the whole of bun.lock again (a minute and more on Windows).
      # After a lock change the older cache still has most of the packages, so only new ones download.
      - name: Cache Bun's packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-packages-${{ runner.os }}-bun${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-packages-${{ runner.os }}-bun${{ steps.bun.outputs.bun-version }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build web bundle
        run: bun run build

      - name: Build and exercise the Eve runtime
        run: |
          bun run eve:build
          bun run eve:smoke
          bun run eve:recovery
          bun run eve:integration

  skill-scripts:
    name: Skill scripts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # The oldest Python the skills promise, so a call that needs a newer one fails here.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: tests/skills/requirements.txt

      - name: Install what the scripts need
        run: python -m pip install -r tests/skills/requirements.txt

      # one-take-video's film.mjs is Node: the oldest version it promises. It draws with the runner's own Chrome.
      - uses: actions/setup-node@v7
        with:
          node-version: 26

      # The learn skill reads screen recordings with FFmpeg; its tests fail rather than skip on CI without it.
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Test the scripts that come with the skills
        run: python -m pytest tests/skills

  desktop:
    name: Desktop app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Installers for every platform are built by desktop.yml; this checks the app on each change.
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        id: bun
        with:
          bun-version: 1.4.4

      - name: Install Linux libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Without it every run unpacks the whole of bun.lock again (a minute and more on Windows).
      # After a lock change the older cache still has most of the packages, so only new ones download.
      - name: Cache Bun's packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-packages-${{ runner.os }}-bun${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-packages-${{ runner.os }}-bun${{ steps.bun.outputs.bun-version }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The Bun runtime and node-pty for this machine, which the stage step would download again
      # otherwise (about 50 s on Windows).
      - name: Cache the desktop downloads
        uses: actions/cache@v6
        with:
          path: src-tauri/.cache
          key: desktop-downloads-${{ runner.os }}-bun${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}
          restore-keys: desktop-downloads-${{ runner.os }}-bun${{ steps.bun.outputs.bun-version }}-

      # bundles the server, builds the page and gets the Bun runtime into src-tauri/
      - name: Stage the desktop app
        run: bun scripts/build-desktop.ts

      - name: Run the staged server the way the app does
        run: bun run desktop:smoke

      - name: Check the Rust code
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
