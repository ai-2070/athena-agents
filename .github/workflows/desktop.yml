name: Desktop apps

# Builds the desktop app's installers for Windows, macOS and Linux (x64 and arm64).
# Pushing a tag like v0.3.0 also puts them in a draft GitHub release; the tag must match
# package.json's version. Run it by hand from the Actions tab to just get the installers.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            native: true
          # cross-compiled; the MSI tooling (WiX 3) can't make arm64 installers
          - name: Windows arm64
            runner: windows-latest
            target: aarch64-pc-windows-msvc
            bundles: nsis
            native: false
          - name: macOS Apple silicon
            runner: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
            native: true
          - name: macOS Intel
            runner: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
            native: false
          # 22.04 so the Linux builds also run on older distributions (glibc)
          - name: Linux x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
            native: true
          - name: Linux arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,rpm,appimage
            native: true
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install Linux libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Runs scripts/build-desktop.ts first (beforeBuildCommand), which gets the Bun runtime
      # and the terminal module for the target. Unsigned: see docs/desktop.md to sign.
      - name: Build the app
        run: bunx tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Run the bundled server the way the app does
        if: matrix.native
        run: bun scripts/desktop-smoke.ts --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: my-dashboard-${{ matrix.target }}
          # (the .app is left out: zipped by upload-artifact it would lose its file modes; the .dmg has it)
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
