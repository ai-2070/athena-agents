<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Station scene</title>
    <!-- three.js and its addons come from the Station (no network in a scene) -->
    <script type="importmap">
      {
        "imports": {
          "three": "/scene-lib/three/three.module.js",
          "three/addons/": "/scene-lib/three/addons/"
        }
      }
    </script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg, #f6f6f4);
        font-family: system-ui, sans-serif;
      }
      canvas {
        display: block;
      }
      #labels {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .label {
        position: absolute;
        left: 0;
        top: 0;
        transform: translate(-50%, -100%);
        white-space: nowrap;
        font-size: 12px;
        line-height: 1.3;
        padding: 2px 7px;
        border-radius: 6px;
        color: var(--ink, #1c1c1e);
        background: var(--chip, rgba(255, 255, 255, 0.82));
        border: 1px solid var(--line, rgba(0, 0, 0, 0.08));
      }
      .label.team {
        font-weight: 600;
        font-size: 13px;
      }
      .label small {
        display: block;
        color: var(--dim, #6b6b70);
        font-size: 11px;
        max-width: 220px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    </style>
  </head>
  <body>
    <div id="labels"></div>
    <script type="module" src="starter.js"></script>
  </body>
</html>
